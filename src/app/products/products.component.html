<h2 mat-dialog-title>Products in Cart</h2>
    <mat-dialog-content>
      <ul>
        <li *ngFor="let product of data.products">{{ product }}</li>
      </ul>
    </mat-dialog-content>
    <mat-dialog-actions>
      <button mat-button mat-dialog-close>Close</button>
    </mat-dialog-actions>
